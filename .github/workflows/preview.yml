name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing-page/pnpm-lock.yaml

      - name: Install landing-page dependencies
        run: pnpm --dir landing-page install --frozen-lockfile

      - name: Build unified preview
        run: VITE_BASE_PATH="/Manus_Cairn_Careers/" pnpm --dir landing-page run build

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
